name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The gate's values in CI are fixed and meaningless — nothing real is behind them.
  ARVEN_PASSPHRASE: test-passphrase
  ARVEN_SESSION_SECRET: test-session-secret

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    name: typecheck · unit · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps webkit

      - name: End-to-end tests
        run: pnpm e2e
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # The suite above just produced screenshots from the code as it stands.
      # Compare the *set* of them with what the pull request carries, so a new
      # screen that was never committed, or one left behind after a screen was
      # removed, fails the build.
      #
      # Deliberately not a pixel comparison: these are generated on macOS and CI
      # runs Ubuntu, where font rasterisation differs, so every byte-level check
      # would fail for reasons that have nothing to do with the change. The real
      # correctness gate is the suite itself — if the interface is broken, the
      # tests above have already failed.
      - name: Check the committed screens are current
        if: github.event_name == 'pull_request'
        run: |
          generated=$(ls test-results/screens/*.png 2>/dev/null | xargs -n1 basename | sort || true)
          committed=$(ls .github/screens/*.png 2>/dev/null | xargs -n1 basename | sort || true)

          if [ "$generated" = "$committed" ]; then
            echo "✓ $(echo "$committed" | grep -c . ) screens, matching what this run produced"
            exit 0
          fi

          echo "✕ the committed screens do not match what the code produces"
          echo
          diff <(echo "$committed") <(echo "$generated") \
            --label "committed (.github/screens)" --label "produced by this run" -u || true
          echo
          echo "Run 'pnpm screens' and commit the result."
          exit 1

      - name: Comment on the pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const dir = '.github/screens';
            const shots = fs.existsSync(dir) ? fs.readdirSync(dir).filter(f => f.endsWith('.png')).sort() : [];
            const passed = '${{ job.status }}' === 'success';
            const branch = context.payload.pull_request.head.ref;
            const base = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/blob/${branch}/.github/screens`;

            const body = [
              `### ${passed ? '✓' : '✕'} CI — ${passed ? 'green' : 'failed'}`,
              '',
              shots.length
                ? shots.map((s) => `- [${s.replace(/\.png$/, '')}](${base}/${s})`).join('\n')
                : '_No screens captured._',
              '',
              `_Screens render inline under **Files changed** — GitHub cannot embed images from a private repo in a comment._`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body.startsWith('### ') && c.body.includes('CI —'),
            );

            const params = { owner: context.repo.owner, repo: context.repo.repo, body };
            if (existing) {
              await github.rest.issues.updateComment({ ...params, comment_id: existing.id });
            } else {
              await github.rest.issues.createComment({ ...params, issue_number: context.issue.number });
            }

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
