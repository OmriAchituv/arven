name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The gate's values in CI are fixed and meaningless — nothing real is behind them.
  ARVEN_PASSPHRASE: test-passphrase
  ARVEN_SESSION_SECRET: test-session-secret

permissions:
  contents: read
  pull-requests: write

jobs:
  verify:
    name: typecheck · unit · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps webkit

      - name: End-to-end tests
        run: pnpm e2e
        env:
          # Absent on forks and before the database is wired; the round-trip spec
          # skips itself rather than failing when it is missing.
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      - name: Upload screenshots
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screens
          path: test-results/screens/
          if-no-files-found: warn
          retention-days: 14

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14

      - name: Comment on the pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const dir = 'test-results/screens';
            const shots = fs.existsSync(dir) ? fs.readdirSync(dir).sort() : [];
            const passed = '${{ job.status }}' === 'success';

            const body = [
              `### ${passed ? '✓' : '✕'} CI — ${passed ? 'green' : 'failed'}`,
              '',
              shots.length
                ? `**Screens captured** (${shots.length})\n` +
                  shots.map((s) => `- \`${s.replace(/\.png$/, '')}\``).join('\n')
                : '_No screens captured._',
              '',
              `[Download screenshots →](${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}#artifacts)`,
              '',
              '_The Vercel bot comments the preview URL separately — open that on your phone for the real check._',
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body.startsWith('### ') && c.body.includes('CI —'),
            );

            const params = { owner: context.repo.owner, repo: context.repo.repo, body };
            if (existing) {
              await github.rest.issues.updateComment({ ...params, comment_id: existing.id });
            } else {
              await github.rest.issues.createComment({ ...params, issue_number: context.issue.number });
            }
