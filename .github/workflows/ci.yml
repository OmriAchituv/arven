name: CI

on:
  pull_request:
    # Screenshots are committed back to the branch by this workflow. Without
    # this, that push would trigger another run, which would push again.
    paths-ignore: [".github/screens/**"]
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

env:
  # The gate's values in CI are fixed and meaningless — nothing real is behind them.
  ARVEN_PASSPHRASE: test-passphrase
  ARVEN_SESSION_SECRET: test-session-secret

permissions:
  contents: write
  pull-requests: write

jobs:
  verify:
    name: typecheck · unit · e2e
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - uses: actions/checkout@v4
        with:
          # The head of the branch rather than the merge result, so screenshots
          # can be pushed back to it.
          ref: ${{ github.event.pull_request.head.ref || github.ref }}

      - uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Unit tests
        run: pnpm test

      - name: Build
        run: pnpm build

      - name: Install Playwright browsers
        run: pnpm exec playwright install --with-deps webkit

      - name: End-to-end tests
        run: pnpm e2e
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}

      # Committed rather than uploaded as an artefact, because GitHub's image
      # proxy cannot authenticate against a private repository — an artefact is
      # a zip download on a phone, whereas a committed PNG renders inline in the
      # Files changed tab, where you are already signed in.
      - name: Publish screenshots to the branch
        if: always() && github.event_name == 'pull_request'
        run: |
          rm -rf .github/screens
          mkdir -p .github/screens
          cp test-results/screens/*.png .github/screens/ 2>/dev/null || true

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A .github/screens

          if git diff --cached --quiet; then
            echo "screens unchanged"
            exit 0
          fi

          git commit -m "chore: screens for ${GITHUB_SHA::7}"
          git push origin HEAD:"${{ github.event.pull_request.head.ref }}"

      - name: Comment on the pull request
        if: always() && github.event_name == 'pull_request'
        uses: actions/github-script@v7
        with:
          script: |
            const fs = require('fs');
            const dir = '.github/screens';
            const shots = fs.existsSync(dir) ? fs.readdirSync(dir).filter(f => f.endsWith('.png')).sort() : [];
            const passed = '${{ job.status }}' === 'success';
            const branch = context.payload.pull_request.head.ref;
            const base = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/blob/${branch}/.github/screens`;

            const body = [
              `### ${passed ? '✓' : '✕'} CI — ${passed ? 'green' : 'failed'}`,
              '',
              shots.length
                ? shots.map((s) => `- [${s.replace(/\.png$/, '')}](${base}/${s})`).join('\n')
                : '_No screens captured._',
              '',
              `_Screens render inline under **Files changed** — GitHub cannot embed images from a private repo in a comment._`,
            ].join('\n');

            const { data: comments } = await github.rest.issues.listComments({
              owner: context.repo.owner,
              repo: context.repo.repo,
              issue_number: context.issue.number,
            });
            const existing = comments.find(
              (c) => c.user.type === 'Bot' && c.body.startsWith('### ') && c.body.includes('CI —'),
            );

            const params = { owner: context.repo.owner, repo: context.repo.repo, body };
            if (existing) {
              await github.rest.issues.updateComment({ ...params, comment_id: existing.id });
            } else {
              await github.rest.issues.createComment({ ...params, issue_number: context.issue.number });
            }

      - name: Upload Playwright report
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          retention-days: 14
